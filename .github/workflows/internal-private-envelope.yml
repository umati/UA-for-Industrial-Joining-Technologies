name: Internal — Private Envelope Validation

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *" # once daily at 03:17 UTC

permissions:
  contents: write
  pull-requests: write
  checks: write

jobs:
  private-envelope-validation:
    name: Root Runner — Web Client Static (Private Required)
    environment: private-envelope-validation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check GitHub App secret availability
        id: app_secret_check
        env:
          IJT_PRIVATE_ENVELOPE_APP_PRIVATE_KEY: ${{ secrets.IJT_PRIVATE_ENVELOPE_APP_PRIVATE_KEY }}
        run: |
          if [ -n "${IJT_PRIVATE_ENVELOPE_APP_PRIVATE_KEY}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Missing IJT_PRIVATE_ENVELOPE_APP_PRIVATE_KEY in environment 'private-envelope-validation'."
            exit 1
          fi

      - name: Create GitHub App installation token
        id: app_token
        if: steps.app_secret_check.outputs.available == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: Iv23li545ZVwTp1aSPF7
          private-key: ${{ secrets.IJT_PRIVATE_ENVELOPE_APP_PRIVATE_KEY }}
          owner: ijt-opcua-modules
          repositories: IJT_Web_Client_Envelop_Plugin
          permission-contents: read

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: steps.app_secret_check.outputs.available == 'true'
        with:
          persist-credentials: false
          submodules: false
          token: ${{ steps.app_token.outputs.token }}

      - name: Initialize private Envelope submodule explicitly
        if: steps.app_secret_check.outputs.available == 'true'
        env:
          GH_APP_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          git -c "url.https://x-access-token:${GH_APP_TOKEN}@github.com/.insteadOf=https://github.com/" \
            submodule update --checkout --init --recursive -- OPC_UA_Clients/Release2/IJT_Web_Client/src/javascripts/views/envelope

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        if: steps.app_secret_check.outputs.available == 'true'
        with:
          python-version-file: ".python-version"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        if: steps.app_secret_check.outputs.available == 'true'
        with:
          node-version-file: ".nvmrc"
          check-latest: true

      - name: Run root Web Client static suite with private modules required
        if: steps.app_secret_check.outputs.available == 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}/OPC_UA_Clients/Release2/IJT_Web_Client:${{ github.workspace }}/OPC_UA_Clients/Release2/IJT_Web_Client/src/javascripts/views/envelope/python
          PYTEST_ADDOPTS: "--ignore=tests/python"
          # Private-module validation remains blocking for findings/tool errors;
          # npm advisory-service availability is reported as infrastructure.
          IJT_NPM_AUDIT_MODE: offline
        run: python run_all_tests.py --suite web-client-static --private-modules require

      - name: Check for Envelope submodule drift and validate latest
        if: steps.app_secret_check.outputs.available == 'true'
        id: drift_check
        env:
          GH_APP_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          set -euo pipefail
          CURRENT_PIN=$(git rev-parse :OPC_UA_Clients/Release2/IJT_Web_Client/src/javascripts/views/envelope)
          LATEST_REMOTE=$(git -c "url.https://x-access-token:${GH_APP_TOKEN}@github.com/.insteadOf=https://github.com/" ls-remote https://github.com/ijt-opcua-modules/IJT_Web_Client_Envelop_Plugin.git refs/heads/main | cut -f1)
          echo "Current pinned commit: ${CURRENT_PIN}"
          echo "Latest Envelope main:  ${LATEST_REMOTE}"
          if [ "${CURRENT_PIN}" != "${LATEST_REMOTE}" ]; then
            {
              echo "drift=true"
              echo "current_pin=${CURRENT_PIN}"
              echo "latest_remote=${LATEST_REMOTE}"
            } >> "$GITHUB_OUTPUT"
            echo "::warning::Envelope submodule pointer in IJT (${CURRENT_PIN:0:7}) is behind latest Envelope main (${LATEST_REMOTE:0:7})."
          else
            echo "drift=false" >> "$GITHUB_OUTPUT"
            echo "Envelope submodule pointer is in sync with latest main."
          fi

      - name: Validate and sync latest Envelope main
        if: steps.app_secret_check.outputs.available == 'true' && steps.drift_check.outputs.drift == 'true'
        env:
          GH_APP_TOKEN: ${{ steps.app_token.outputs.token }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LATEST_SHA: ${{ steps.drift_check.outputs.latest_remote }}
          PYTHONPATH: ${{ github.workspace }}/OPC_UA_Clients/Release2/IJT_Web_Client:${{ github.workspace }}/OPC_UA_Clients/Release2/IJT_Web_Client/src/javascripts/views/envelope/python
          PYTEST_ADDOPTS: "--ignore=tests/python"
          IJT_NPM_AUDIT_MODE: offline
        run: |
          set -euo pipefail
          echo "Updating Envelope submodule to latest remote main (${LATEST_SHA:0:7})..."
          git -c "url.https://x-access-token:${GH_APP_TOKEN}@github.com/.insteadOf=https://github.com/" \
            submodule update --remote --checkout -- OPC_UA_Clients/Release2/IJT_Web_Client/src/javascripts/views/envelope
          python run_all_tests.py --suite web-client-static --private-modules require
          echo "Validation passed for latest Envelope main."

          BRANCH_NAME="automation/bump-envelope-${LATEST_SHA:0:7}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "${BRANCH_NAME}"
          git add OPC_UA_Clients/Release2/IJT_Web_Client/src/javascripts/views/envelope
          COMMIT_MSG=$(printf "chore(submodule): bump Envelope plugin to %s\n\n1. Update Envelope submodule pointer to latest verified commit %s.\n2. Verified with python run_all_tests.py web-client-static suite." "${LATEST_SHA:0:7}" "${LATEST_SHA:0:7}")
          git commit -m "${COMMIT_MSG}" || exit 0

          echo "Attempting to push sync branch and create PR..."
          if git push origin "${BRANCH_NAME}" --force; then
            PR_BODY=$(printf "Automated synchronization of private Envelope submodule pointer to latest verified main commit %s.\n\nValidation: python run_all_tests.py suite web-client-static with private modules passed cleanly." "${LATEST_SHA}")
            if ! gh pr view "${BRANCH_NAME}" >/dev/null 2>&1; then
              gh pr create \
                --title "chore(submodule): bump Envelope plugin to ${LATEST_SHA:0:7}" \
                --body "${PR_BODY}" \
                --base main \
                --head "${BRANCH_NAME}" || echo "::warning::Unable to create PR automatically; check workflow write permissions."
            fi
          else
            echo "::warning::Unable to push branch ${BRANCH_NAME}; check repository write permissions."
          fi
