services:
  ijt_web_client:
    image: ${IJT_WEB_IMAGE:-ijt_web_client:latest}
    ports:
      - "${WEB_CLIENT_HTTP_PORT:-3000}:${HTTP_PORT:-3000}"
      - "${WEB_CLIENT_WS_PORT:-8001}:${WS_PORT:-8001}"
    environment:
      IS_DOCKER: "true"
      IJT_OPCUA_HOST_REWRITE: "true"
      IJT_SKIP_OPCUA_STARTUP_CHECK: "true"
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      HTTP_PORT: "${HTTP_PORT:-3000}"
      WS_PORT: "${WS_PORT:-8001}"
    restart: "no"
    # HTTP readiness + real WebSocket upgrade (docker_healthcheck.py in image).
    healthcheck:
      test: ["CMD", "python", "docker_healthcheck.py"]
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 6
