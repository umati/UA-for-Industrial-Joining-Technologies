# Generic remote-start example for one JoiningProcess.
# Copy privately and replace placeholders after GetJoiningProcessList discovery.

schema_version: 1
profile_name: "Joining Process Remote Start Example"
description: "Single-result remote-start workflow using stable JoiningProcess identifiers."
capabilities_file: "../server_capabilities.yaml"

target:
  endpoint: "opc.tcp://<target-server-host>:40451"

cu_execution:
  default_mode: automated
  scoring_mode: diagnostic
  precondition_failure_policy: blocked
  allow_manual_steps: false
  default_timeout_seconds: 120
  state_changing_methods:
    default_policy: require_explicit_opt_in
    allowed_methods:
      - EnableAsset
      - SelectJoiningProcess
      - StartSelectedJoining
      - SendIdentifiers
      - SendTextIdentifiers
      - ResetIdentifiers
  method_status_policies: {}
  extension_fields: {}

selection:
  tool:
    policy: first_ready
    product_instance_uri: ""
    capability_tags: []
  joining_process:
    policy: exact_match
    joining_process_id: "<joining-process-id>"
    joining_process_origin_id: "<joining-process-origin-id>"
    selection_name: ""
    capability_tags: []

triggers:
  result:
    mode: start_selected_joining
    timeout_seconds: 120
    deselect_after_joining: false
  event:
    mode: observe_only
    timeout_seconds: 60
  condition:
    mode: observe_only
    timeout_seconds: 60

workflow_execution:
  start_invocation_policy: single_start_produces_final_result
  expected_operation_count: 1
  expected_results:
    classification: single
    final_result_required: true
    timeout_seconds: 120
  cleanup:
    policy: best_effort_with_evidence
    deselect_process: false
    reset_identifiers: false

reporting:
  output_dir: "test-results/target-server-cu"
  sanitize_shared_artifacts: true
  keep_local_exact_debug_artifacts: false
