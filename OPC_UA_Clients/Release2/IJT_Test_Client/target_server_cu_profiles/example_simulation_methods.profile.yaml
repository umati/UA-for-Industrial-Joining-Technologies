# Target Server CU Profile — Simulation Methods Example (OPC 40450-1 Release 2.0)
#
# Use this profile for an OPC UA IJT Server under test that exposes simulation helper
# methods (such as SimulateResults or SimulateEvents). This can be the checked-in
# Release 2 Simulator or any custom server providing simulation test hooks.
#
# Run Commands (from OPC_UA_Clients/Release2/IJT_Test_Client):
#   - Preflight Check:
#     python run_all_tests.py --preflight-only --profile target_server_cu_profiles/example_simulation_methods.profile.yaml
#   - Run Against Simulator Port:
#     python run_all_tests.py --phase2 --profile target_server_cu_profiles/example_simulation_methods.profile.yaml
#
# File-format version understood by the runner.
schema_version: 1
# Human-readable report name.
profile_name: "Generic Simulation Methods Target Server"
# Human-readable description of the evidence strategy.
description: >
  Sanitized example profile for target servers that expose simulation helper
  methods for result and event evidence.

# Simulator-specific CU declaration controlling test selection.
capabilities_file: "simulator.capabilities.yaml"

target:
  # run_all_tests.py launches the checked-in simulator on this isolated port.
  endpoint: "opc.tcp://localhost:40462"

cu_execution:
  # Run without operator prompts by default.
  default_mode: automated
  # Report all outcomes without making a conformance claim.
  scoring_mode: diagnostic
  # Report unavailable simulator prerequisites as Blocked.
  precondition_failure_policy: blocked
  # Simulation helpers require no physical operator steps.
  allow_manual_steps: false
  # Default OPC UA call timeout unless a trigger overrides it.
  default_timeout_seconds: 60
  state_changing_methods:
    # Real state-changing calls require explicit authorization.
    default_policy: require_explicit_opt_in
    # Safety permission list only; CU support and existing tests control coverage.
    # Simulator helper calls are governed separately by simulate_methods triggers.
    allowed_methods: []

triggers:
  result:
    # Use non-standard simulator helpers to generate result evidence.
    mode: simulate_methods
    # Maximum wait for the simulated result.
    timeout_seconds: 30
    # No JoiningProcess was selected by this profile.
    deselect_after_joining: false
  event:
    # Use non-standard simulator helpers to generate event evidence.
    mode: simulate_methods
    # Maximum wait for the simulated event.
    timeout_seconds: 30
  condition:
    # Use non-standard simulator helpers to generate condition evidence.
    mode: simulate_methods
    # Maximum wait for the simulated condition.
    timeout_seconds: 30

workflow_execution:
  # One simulation request produces the final result.
  start_invocation_policy: single_start_produces_final_result
  # One simulated joining operation is expected.
  expected_operation_count: 1
  expected_results:
    # The simulator helper should produce one SingleResult.
    classification: single
    # Missing SingleResult evidence leaves this workflow incomplete.
    final_result_required: true
    # Maximum workflow-level result wait.
    timeout_seconds: 30
  cleanup:
    # Attempt safe cleanup without discarding evidence on cleanup failure.
    policy: best_effort_with_evidence
    # No JoiningProcess selection is owned by this workflow.
    deselect_process: false
    # No identifier lifecycle is owned by this workflow.
    reset_identifiers: false

reporting:
  # Default artifact directory.
  output_dir: "test-results/target-server-cu"
  # Redact installation-specific values from shareable reports.
  sanitize_shared_artifacts: true
  # Do not retain an additional unsanitized artifact set.
  keep_local_exact_debug_artifacts: false
