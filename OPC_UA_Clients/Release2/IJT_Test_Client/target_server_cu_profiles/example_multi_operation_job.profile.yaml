# Complete real-controller example using only generic OPC UA IJT terms.
# Copy this file locally, then replace the endpoint and JoiningProcess IDs.

schema_version: 1
profile_name: "Full Multi-operation Job Result Workflow Example"
description: >
  GetJoiningProcessList may return several programs, batches, or jobs.
  This profile chooses one Job-producing JoiningProcess for a deterministic run.
  Select a Job-producing JoiningProcess by JoiningProcessId and
  JoiningProcessOriginId, then use six remote starts to exercise two batches
  with three operations each, producing SingleResult, BatchResult, and final
  JobResult evidence. IncrementJoiningProcessCounter generates
  InterventionResult evidence with the same Tool and process IDs.
capabilities_file: "example_multi_operation_job.capabilities.yaml"

target:
  endpoint: "opc.tcp://<target-server-host>:40451"
  expected_server:
    application_name: ""
    application_version: ""
    warn_only_on_version_drift: true

cu_execution:
  default_mode: automated
  scoring_mode: diagnostic
  precondition_failure_policy: blocked
  allow_manual_steps: false
  default_timeout_seconds: 120
  state_changing_methods:
    default_policy: require_explicit_opt_in
    allowed_methods:
      - EnableAsset
      - SelectJoiningProcess
      - StartSelectedJoining
      - IncrementJoiningProcessCounter
  extension_fields:
    allow_disable_asset: false
    enable_asset_policy: always
    # Some servers require a parent batch/job process for counter interventions.
    # If needed, copy counter_parent_process from template.profile.yaml and set
    # that parent process's stable IDs.
    intervention_method: IncrementJoiningProcessCounter

selection:
  tool:
    # Discover the first ready Tool and use its ProductInstanceUri for all
    # Tool-context methods. Set an exact PIU only when discovery is unsuitable.
    policy: first_ready
    product_instance_uri: ""
  joining_process:
    # GetJoiningProcessList discovers all available processes. One profile
    # deliberately selects one process so its starts and result layers are known.
    # Copy the IDs returned for the program/job this profile should exercise.
    # Typical format: "123e4567-e89b-12d3-a456-426614174000".
    policy: exact_match
    joining_process_id: "<joining-process-id>"
    joining_process_origin_id: "<joining-process-origin-id>"
    # Use SelectionName only when the server does not provide stable IDs.
    selection_name: ""

triggers:
  result:
    mode: start_selected_joining
    timeout_seconds: 120
    deselect_after_joining: false
  event:
    mode: none
    timeout_seconds: 60
  condition:
    mode: none
    timeout_seconds: 60

workflow_execution:
  # Six starts model two batches of three operations for this example.
  # Change this count and the expected result layers for another process.
  start_invocation_policy: one_start_per_operation
  expected_operation_count: 6
  expected_results:
    classification: job
    intermediate_classifications:
      - single
      - batch
      # Companion evidence generated by intervention_method; it is not a child
      # layer of JobResult.
      - intervention
    final_result_required: true
    timeout_seconds: 120
  cleanup:
    policy: best_effort_with_evidence
    deselect_process: false
    reset_identifiers: false

reporting:
  output_dir: "test-results/target-server-cu"
  sanitize_shared_artifacts: true
  keep_local_exact_debug_artifacts: false
