# --------------------------------------------------------------------------
# workflows: Selected and approved workflows, plus the tool/process selectors they use.
# --------------------------------------------------------------------------
workflows:

  # Workflow names approved for this SUT (e.g. remote_start_multi_operation_job, counter_intervention,
  # remote_abort_job, remote_reset_job).
  # Schema default: []
  approved: []

  # Maximum accepted StartSelectedJoining RPC calls for a multi-operation compound process
  # (Job/Batch/Sync) before stopping. Single/Program processes are always capped at 1 start. Execution
  # exits early as soon as a terminal completed result arrives.
  # Schema default: 6
  max_start_invocations: 6

  # Explicitly approve compatible processes returned by live discovery as workflow candidates. Does
  # not authorize methods or override exact_match restrictions. False blocks automatic physical
  # selection.
  # Schema default: false
  allow_discovered_processes: false

  # Maximum candidates attempted per workflow.
  # Schema default: 3
  max_candidates: 3

  # Maximum attempted StartSelectedJoining calls across all candidates in one workflow. Failed or
  # uncertain calls also consume this budget.
  # Schema default: 6
  max_total_start_invocations: 6

  # Maximum accepted StartSelectedJoining calls while waiting for each result classification.
  # Supported keys are single, batch, sync, and job. Every value is also capped by
  # max_start_invocations.
  # Schema default: {single: 1, batch: 3, sync: 3, job: 6}
  max_start_invocations_by_result_classification:
    # Entry for single. Maximum accepted StartSelectedJoining calls while waiting for each result
    # classification. Supported keys are single, batch, sync, and job. Every value is also capped by
    # max_start_invocations.
    # Schema default: 1
    single: 1
    # Entry for batch. Maximum accepted StartSelectedJoining calls while waiting for each result
    # classification. Supported keys are single, batch, sync, and job. Every value is also capped by
    # max_start_invocations.
    # Schema default: 3
    batch: 3
    # Entry for sync. Maximum accepted StartSelectedJoining calls while waiting for each result
    # classification. Supported keys are single, batch, sync, and job. Every value is also capped by
    # max_start_invocations.
    # Schema default: 3
    sync: 3
    # Entry for job. Maximum accepted StartSelectedJoining calls while waiting for each result
    # classification. Supported keys are single, batch, sync, and job. Every value is also capped by
    # max_start_invocations.
    # Schema default: 6
    job: 6

  # Pacing delay in seconds between consecutive StartSelectedJoining invocations for compound
  # processes (Job/Batch/Sync). Allows controller state settlement and event drain (default: 0.25s).
  # Not applied to single operations. Queue inspection and this drain reduce extra-start races but
  # cannot eliminate the non-atomic check-to-start window.
  # Schema default: 0.25
  consecutive_start_delay_seconds: 0.25

  # How the Tool under test is discovered or pinned.
  tool_selector:

    # Automatic policies require exactly one Tool. With several Tools, configure the intended
    # ProductInstanceUri. exact_match always requires that identity. Policy names do not rank Tool
    # readiness.
    # Schema default: first_ready
    # Values: exact_match, first_available, first_compatible, first_ready
    policy: first_ready

    # Exact Tool ProductInstanceUri. Leave empty only for single-Tool discovery. Do not commit real
    # serial numbers.
    # Schema default: ''
    product_instance_uri: ''

    # Tool tags retained in configuration. Current Tool discovery does not filter by these tags.
    # Schema default: []
    capability_tags: []

  # Default joining-process selection for all result classifications.
  process_selector:

    # Joining process selection policy. Non-exact policies order direct standard-classification
    # matches first and may then try a Job process as bounded evidence for Batch or Sync results. Only
    # a completed requested-classification result proves support. all_compatible tests every ordered
    # candidate, while the other non-exact policies stop after the first proof. exact_match pins an
    # advertised identifier. A result-specific exact selector may intentionally cross
    # process-classification metadata, but still requires result-stream proof. Names and vendor fields
    # never prove capability.
    # Schema default: first_compatible
    # Values: all_compatible, exact_match, first_available, first_compatible, first_ready
    policy: first_compatible

    # Exact matching key used when policy is exact_match. JoiningProcessId is the portable default.
    # SelectionName and JoiningProcessOriginId are explicit controller-specific alternatives. A match
    # must identify exactly one current process.
    # Schema default: joining_process_id
    # Values: joining_process_id, joining_process_origin_id, selection_name
    match_by: joining_process_id

    # Exact JoiningProcessId. Do not commit real IDs. With automatic discovery, leave it empty to use
    # current advertised IDs. With exact_match, configure the selected key.
    # Schema default: ''
    joining_process_id: ''

    # Exact JoiningProcessOriginId value when match_by selects it.
    # Schema default: ''
    joining_process_origin_id: ''

    # Exact controller-specific SelectionName value when match_by selects it.
    # Schema default: ''
    selection_name: ''

    # Strategy for populating JoiningProcessIdentificationDataType: id_only (default/portable, sends
    # JoiningProcessId only with empty OriginId and SelectionName, recommended for generic profiles),
    # id_with_origin (sends JoiningProcessId and OriginId), id_with_selection_name (sends
    # JoiningProcessId and an advertised SelectionName, use only when the controller needs both),
    # selection_name_only (sends only an advertised SelectionName with empty ID and OriginId, requires
    # a unique live target and never constructs vendor-specific names), all_available (sends all three
    # identifiers, use only when hardware evidence proves all are required).
    # Schema default: id_only
    # Values: all_available, id_only, id_with_origin, id_with_selection_name, selection_name_only
    identifier_strategy: id_only

    # Optional tags used to narrow process selection.
    # Schema default: []
    capability_tags: []

  # Optional per-classification process selectors (single, batch, job, sync ...). Classification is
  # resolved from server metadata (JoiningProcessMetaData.Classification: 1=Other, 2=Program, 3=Sync,
  # 4=Batch, 5=Job), which is a different integer domain from ResultMetaData.Classification. YAML
  # classification names are configuration keys only and are never sent as OPC UA Classification
  # values. Each entry supports the same fields as process_selector.
  process_selectors_by_classification: {}

  # Result evidence this SUT is expected to produce.
  expected_results:

    # Primary/final result classification.
    # Schema default: single
    # Values: any, batch, intervention, job, single, stitching, sync, text
    classification: single

    # Result classifications emitted before or alongside the final result.
    # Schema default: []
    intermediate_classifications: []

    # Require a final result before the workflow counts as complete.
    # Schema default: true
    final_result_required: true

    # How captured results resolve a referenced child ResultId. terminal_required waits for
    # IsPartial=false. partial_allowed accepts the latest partial update for open or effectively
    # infinite batches.
    # Schema default: terminal_required
    # Values: partial_allowed, terminal_required
    referenced_child_completion_policy: terminal_required

    # Expected ResultState (OPC 40001-101 Machinery Result) for terminal completion: 1 (COMPLETED), 3
    # (ABORTED), or 4 (FAILED).
    # Schema default: 1
    expected_terminal_result_state: 1

    # When true, abort workflows reject terminal results evaluated as OK (1).
    # Schema default: false
    reject_ok_evaluation_on_abort: false

  # What the runner restores after a workflow.
  cleanup:

    # Cleanup policy after the run.
    # Schema default: best_effort_with_evidence
    # Values: best_effort_with_evidence, no_cleanup, strict_cleanup
    policy: best_effort_with_evidence

    # Deselect the joining process after the run.
    # Schema default: true
    deselect_process: true

    # Reset identifiers after the run.
    # Schema default: false
    reset_identifiers: false

  # Reuse only complete, immutable evidence within this run when the endpoint, Tool, current process
  # list, workflow bounds and selection policy still match.
  evidence_reuse:

    # Reuse completed matching results for related CU tests within this run.
    # Schema default: false
    enabled: false

    # Evidence lifetime. current_run never persists evidence across runner invocations.
    # Schema default: current_run
    # Values: current_run
    scope: current_run

# --------------------------------------------------------------------------
# triggers: How result, event, and condition evidence is produced on this SUT.
# --------------------------------------------------------------------------
triggers:

  # Result evidence trigger.
  result:

    # Result trigger mode (simulator, remote start, manual operator, or passive).
    # Schema default: none
    # Values: manual_trigger, none, observe_only, simulate_methods, start_selected_joining
    mode: none

    # Deselect the joining process after each joining operation.
    # Schema default: false
    deselect_after_joining: false

  # Event evidence trigger.
  event:

    # Event trigger mode.
    # Schema default: observe_only
    # Values: manual_trigger, none, observe_only, simulate_methods, workflow_actions
    mode: observe_only

    # Event CU key to approved workflow name. Used only by workflow_actions mode.
    # Schema default: {}
    actions: {}

  # Condition evidence trigger.
  condition:

    # Condition trigger mode.
    # Schema default: observe_only
    # Values: manual_trigger, none, observe_only, simulate_methods
    mode: observe_only

# --------------------------------------------------------------------------
# execution_policy: State/method execution policy and the risk approvals that back it.
# --------------------------------------------------------------------------
execution_policy:

  # Execution mode for this SUT.
  # Schema default: automated
  # Values: automated, guided, preflight_only
  default_mode: preflight_only

  # Allow operator prompts and waits.
  # Schema default: false
  allow_manual_steps: false

  # What to do when a claimed CU's runtime preconditions are missing.
  # Schema default: blocked
  # Values: blocked, failed, skip
  precondition_failure_policy: blocked

  # Per-method status classification overrides (method BrowseName -> accepted|warning|fail).
  # Schema default: {}
  method_status_policies: {}

  # Explicit counter-effect scenarios. Every entry has these fields: method is the OPC UA BrowseName.
  # count is a positive limited change. process_policy defaults to exact_match. Opt-in discover_unique
  # resolves exactly one current process of process_classification (single, batch, sync, or job,
  # default job), respecting exact workflow restrictions. It requires allow_discovered_processes and
  # an ID-carrying identifier_strategy. Never retries an attempted mutation. No persistent IDs or
  # vendor names are needed in this mode. match_by selects one exact current-list key
  # (joining_process_id by default, or an explicitly configured joining_process_origin_id or
  # selection_name). identifier_strategy separately controls which identifiers are sent to the method.
  # expected_result_classification optionally requires a partial or final affected-result update that
  # explicitly references the completed InterventionResult. Accepted values are single, batch, sync,
  # job, stitching, intervention, or text.
  # Schema default: []
  counter_effects: []

  # Which state-changing OPC UA methods may be called on this SUT.
  state_changing_methods:

    # Safety default for state-changing method calls.
    # Schema default: require_explicit_opt_in
    # Values: allow_all, deny_all, require_explicit_opt_in
    default_policy: require_explicit_opt_in

    # Safety permissions only: methods explicitly approved for this SUT. This list never creates or
    # enables tests. Workflow approvals and setup are also required. A claimed CU without the required
    # permission remains blocked, not unsupported.
    # Schema default: []
    allowed_methods: []

  # Explicit approvals for operations that change or disturb the SUT.
  risk_approvals:

    # Allow EnableAsset(false) on a real tool. Tests always restore true.
    # Schema default: false
    allow_disable_asset: false

    # when_disabled: only re-enable when found disabled. always: reassert before every workflow.
    # Schema default: when_disabled
    # Values: always, when_disabled
    enable_asset_policy: when_disabled

    # Allow abort/reset style methods that disturb production state.
    # Schema default: false
    allow_destructive_methods: false

    # Who approved these risk settings (name or role).
    # Schema default: ''
    approved_by: ''

    # Change request, ticket, or document reference.
    # Schema default: ''
    approval_reference: ''

  # Method used to generate InterventionResult evidence, when applicable.
  intervention:

    # Intervention method BrowseName. Must also appear in allowed_methods.
    # Schema default: ''
    method: ''

    # Counter value for counter-style intervention methods.
    # Schema default: 1
    count: 1

    # Message recorded with the intervention.
    # Schema default: ''
    message: ''

    # Parent batch/job process some controllers require before counter or abort methods. match_by
    # chooses the single exact key. The default is joining_process_id.
    parent_process:

      # Exact parent-process matching key.
      # Schema default: joining_process_id
      # Values: joining_process_id, joining_process_origin_id, selection_name
      match_by: joining_process_id

      # Parent process ID.
      # Schema default: ''
      joining_process_id: ''

      # Parent process origin ID when match_by selects it.
      # Schema default: ''
      joining_process_origin_id: ''

      # Parent process selection name when match_by selects it.
      # Schema default: ''
      selection_name: ''

  # Use per-run unique identifiers and reset only values created by the active workflow. ResetAll
  # requires its own approved workflow and is never used as cleanup.
  identifier_workflows:

    # Allow approved identifier workflows to mutate test-owned identifiers.
    # Schema default: false
    enabled: false

    # How identifier workflows create collision-safe values.
    # Schema default: run_unique
    # Values: run_unique
    value_policy: run_unique

    # Cleanup may reset only identifiers created by the current test workflow.
    # Schema default: selective_test_owned_only
    # Values: selective_test_owned_only
    cleanup_policy: selective_test_owned_only

    # Allow broad ResetAll only through the separately approved reset_all_identifiers workflow. Never
    # use it as cleanup.
    # Schema default: false
    allow_reset_all: false

  # Configuration for the RequestResults method filter strategy and parameter ranges.
  request_results:

    # RequestResults filtering mode: sequence_number (default and preferred), timestamp, or both.
    # Timestamp mode transmits both sequence arguments as zero. Both mode populates all five
    # arguments, but conforming servers use timestamps only when both sequence arguments are zero (OPC
    # 40450-1).
    # Schema default: sequence_number
    # Values: both, sequence_number, timestamp
    filter_strategy: sequence_number

    # Configured inclusive lower sequence bound for sequence_number or both mode (1..UInt64 max).
    # Active result tests adjust the transmitted window when needed to include the result they just
    # triggered. Timestamp mode ignores this setting and transmits 0.
    # Schema default: 1
    from_sequence_number: 1

    # Configured inclusive upper sequence bound for sequence_number or both mode (at least
    # from_sequence_number, up to UInt64 max, default: 50, providing a safe 50-result compliance
    # window). Active result tests dynamically shift this window to cover recent history ending at the
    # triggered sequence number. Timestamp mode ignores this setting and transmits 0.
    # Schema default: 50
    to_sequence_number: 50

    # Inclusive lower timestamp for timestamp or both mode, as ISO 8601. Use Z or an explicit UTC
    # offset. A timestamp without an offset is interpreted as UTC. When both timestamps are valid,
    # from_time must not be later than to_time. Invalid text uses the safe runtime lower default.
    # Schema default: '2000-01-01T00:00:00Z'
    from_time: '2000-01-01T00:00:00Z'

    # Inclusive upper timestamp for timestamp or both mode, as ISO 8601. Use Z or an explicit UTC
    # offset. A timestamp without an offset is interpreted as UTC. Invalid text uses the safe runtime
    # upper default. Conforming servers ignore both timestamps when sequence bounds are non-zero.
    # Schema default: '9999-01-01T00:00:00Z'
    to_time: '9999-01-01T00:00:00Z'

    # RequestedMinimumDurationBetweenResults as a finite, non-negative number of milliseconds. It is
    # sent as the OPC UA Duration/Double argument. 100.0 ms is the recommended default interval.
    # Schema default: 100.0
    min_duration_ms: 100.0

# --------------------------------------------------------------------------
# timeouts: Separated time budgets. Passive observation, active result completion, whole-workflow, and
# operator budgets are independent so one slow phase cannot mask another.
# --------------------------------------------------------------------------
timeouts:

  # Budget for evidence the client did not trigger itself (observe_only).
  # Schema default: 5.0
  passive_observation_seconds: 5.0

  # Budget for result completion after the client started a joining operation.
  # Schema default: 60.0
  active_result_seconds: 60.0

  # Budget for a complete workflow, including setup and cleanup.
  # Schema default: 120.0
  workflow_seconds: 120.0

  # Budget for a physical operator action (manual trigger modes).
  # Schema default: 300.0
  operator_seconds: 300.0

  # Budget for a single OPC UA method call or read.
  # Schema default: 15.0
  method_call_seconds: 15.0

# --------------------------------------------------------------------------
# scoring: How the run is scored. Strict claimed scope is the default.
# --------------------------------------------------------------------------
scoring:

  # strict_profile: strict claimed scope (default). diagnostic: report everything, no gate.
  # acceptance: zero failed CUs and zero claim mismatches in claimed scope.
  # Schema default: strict_profile
  # Values: acceptance, diagnostic, strict_profile
  mode: strict_profile

  # Keep true: score only what this manifest claims. Unclaimed gaps stay informational.
  # Schema default: true
  claimed_scope_only: true

# --------------------------------------------------------------------------
# reporting: Report output location and redaction settings.
# --------------------------------------------------------------------------
reporting:

  # Directory for evidence reports, relative to the runner root or absolute.
  # Schema default: test-results/target-server-cu
  output_dir: test-results/target-server-cu

  # Remove private host names, serial numbers, Tool IDs and process IDs from shared reports.
  # Schema default: true
  sanitize_shared_artifacts: true

  # Keep private local debug reports with real names and IDs. Leave false for shared or committed
  # runs.
  # Schema default: false
  keep_local_exact_debug_artifacts: false

  # Extra field names whose values must be hidden in shared reports.
  # Schema default: [endpoint, product_instance_uri, joining_process_id, serial_number]
  redact_fields:
    - endpoint
    - product_instance_uri
    - joining_process_id
    - serial_number
