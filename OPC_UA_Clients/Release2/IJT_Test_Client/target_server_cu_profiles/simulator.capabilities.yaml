# OPC UA IJT Server Simulator Capabilities
#
# This file describes the checked-in Release 2 IJT Server Simulator, not the
# IJT specification. run_all_tests.py uses it automatically only when it
# auto-launches the simulator and OPCUA_CAPABILITIES_FILE is not already set.
# For a real controller or a vendor simulator, provide a device-specific
# capabilities file via OPCUA_CAPABILITIES_FILE.

server:
  # Human-readable identity included in capability reports.
  name: "OPC UA IJT Server Simulator"
  # Clarifies that this is the repository fixture, not a production vendor.
  vendor: "Repository simulator"
  # Simulator package/release identifier.
  version: "Release 2"
  # Scope statement for this observed capability declaration.
  description: "Capabilities observed for the checked-in simulator binary."

# ---------------------------------------------------------------------------
# Base Profile
# Start from all official IJT CUs, then remove known simulator gaps below.
# ---------------------------------------------------------------------------
active_profile: full_specification_coverage
# No extra facets are needed beyond the full profile.
supported_facets: []

# Each unsupported entry removes that CU from execution and produces a truthful
# Not Supported skip instead of a misleading failure.
cu_overrides:
  # Result acknowledgement/history methods are not implemented.
  acknowledge_results: unsupported # No AcknowledgeResults method.
  request_unacknowledged_results: unsupported # No unacknowledged-result query method.

  # JoiningProcess transfer, revision, mapping, and deletion methods are absent.
  delete_joining_process: unsupported # Cannot delete downloaded processes.
  get_joining_process: unsupported # Cannot read full process definitions.
  get_joining_process_revision_list: unsupported # No process revision history.
  send_joining_process: unsupported # Cannot download process definitions.
  set_joining_process_mapping: unsupported # Cannot change process mappings.

  # Joint design/component management is outside this simulator build.
  delete_joint_component: unsupported # Cannot delete component definitions.
  delete_joint_design: unsupported # Cannot delete design definitions.
  get_joint_component: unsupported # Cannot read component definitions.
  get_joint_component_list: unsupported # Cannot enumerate component definitions.
  get_joint_design: unsupported # Cannot read joint designs.
  get_joint_design_list: unsupported # Cannot enumerate joint designs.
  get_joint_revision_list: unsupported # No joint revision history.
  joint_component_data: unsupported # No JointComponentData payload support.
  joint_design_data: unsupported # No JointDesignData payload support.
  send_joint_component: unsupported # Cannot download component definitions.
  send_joint_design: unsupported # Cannot download joint designs.

  # Destructive/optional asset operations are intentionally unavailable.
  disconnect_asset: unsupported # Simulator cannot disconnect managed assets.
  reboot_asset: unsupported # Simulator cannot reboot managed assets.
  set_calibration: unsupported # Simulator exposes no calibration write.
  set_offline_timer: unsupported # Simulator exposes no offline-timer write.

  # Optional execution, feedback, and diagnostic methods are unavailable.
  execute_operation: unsupported # No generic ExecuteOperation method.
  feedback_methods: unsupported # No feedback file exchange methods.
  get_error_information: unsupported # No detailed error-information method.
