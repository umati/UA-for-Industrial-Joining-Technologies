# Multi-Server Fleet Benchmark Profile
schema_version: 1
name: "Multi-Server Fleet Benchmark"
description: "Concurrent latency and throughput benchmarking across multi-server OPC UA fleets"

fleet:
  lifecycle: external
  url_template: "opc.tcp://127.0.0.1:{port}"
  port_range: [40001, 40050]

execution:
  mode: both
  duration_seconds: 60.0
  target_sample_count: 500
  burst_trigger_count: 10
  require_full_coverage: true

engine:
  max_worker_processes: 4
  connect_concurrency: 10
  sub_period_ms: 100

thresholds:
  warn_p90_ms: 200.0
  fail_p90_ms: 1000.0
